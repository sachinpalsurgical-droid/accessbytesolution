<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f5f6f0">
    <title>Returning to AccessByteSolutions</title>
    <style>
        :root{font-family:system-ui,sans-serif;color:#17302f;background:#f5f6f0}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.fallback{width:min(440px,100%);padding:32px;background:#fff;border:1px solid #d8e0d9;border-radius:12px}.fallback strong{display:block;color:#126f66;font-size:12px;text-transform:uppercase}.fallback h1{margin:12px 0;font:700 32px/1.1 Georgia,serif}.fallback p{color:#506563;line-height:1.6}.fallback a{display:inline-flex;min-height:46px;align-items:center;padding:0 16px;border-radius:6px;background:#126f66;color:#fff;text-decoration:none;font-weight:700}
    </style>
</head>
<body>
    <main class="fallback">
        <strong>AccessByteSolutions</strong>
        <h1>Taking you back to the page.</h1>
        <p>If you are not redirected, use this link to return to the requested page.</p>
        <a id="fallback-link" href="/">Continue to the site</a>
    </main>
    <script>
        (()=>{
            const project='/accessbytesolution';
            const onProjectPages=location.hostname.endsWith('.github.io');
            const base=onProjectPages?project:'';
            let route=location.pathname;
            if(base&&route.startsWith(base))route=route.slice(base.length)||'/';
            const target=`${base}/#${route}${location.search}`;
            document.getElementById('fallback-link').href=target;
            location.replace(target);
        })();
    </script>
</body>
</html>
